server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Arquivos estáticos – servir o arquivo real ou retornar 404
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot|json)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Pasta public/landing/ (PNGs) não pode ser a rota SPA.
    # Sem isto: /landing → 301 /landing/ → 403 (diretório sem index).
    location = /landing {
        try_files /index.html =404;
    }
    location = /landing/ {
        return 301 /landing;
    }

    # Fallback SPA – sem $uri/ para pastas reais em public/ não virarem 403
    location / {
        try_files $uri /index.html;
    }
}
