server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Arquivos estáticos – servir o arquivo real ou retornar 404
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot|json)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Pasta public/landing/ (PNGs) não pode ser a rota SPA.
    # Sem isto: /landing → 301 /landing/ → 403 (diretório sem index).
    location = /landing {
        try_files /index.html =404;
    }
    location = /landing/ {
        return 301 /landing;
    }

    # /tour é SPA. Não criar pasta public/tour/ (mesmo 403 de /landing).
    # gzip off + sub_filter: crawler do WhatsApp lê og:* no HTML sem executar JS.
    location = /tour {
        gzip off;
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</head>' '<meta property="og:type" content="website"><meta property="og:url" content="https://taktchat.com.br/tour"><meta property="og:title" content="TaktChat em 1 minuto"><meta property="og:description" content="O cliente continua no WhatsApp dele. A empresa ganha fila, dono e historico - sem atender no celular."><meta property="og:image" content="https://taktchat.com.br/landing/f3-atendente-chat-maria.png"><meta property="og:locale" content="pt_BR"><meta name="twitter:card" content="summary_large_image"><meta name="robots" content="noindex, nofollow"></head>';
        try_files /index.html =404;
    }
    location = /tour/ {
        return 301 /tour$is_args$args;
    }
    location = /p/tour {
        return 301 /tour$is_args$args;
    }
    location = /p/tour/ {
        return 301 /tour$is_args$args;
    }

    # Fallback SPA – sem $uri/ para pastas reais em public/ não virarem 403
    location / {
        try_files $uri /index.html;
    }
}
